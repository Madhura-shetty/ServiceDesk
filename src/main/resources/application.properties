# ==========================================
# ServiceDesk Application Configuration
# ==========================================

# Server
server.port=8080

# ----- PostgreSQL Database -----
# Replace these placeholders with your local PostgreSQL details
spring.datasource.url=jdbc:postgresql://localhost:5432/servicedesk_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
# 'update' will auto-create/update tables based on entities.
# Use the provided schema.sql instead if you prefer manual DB setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----- Jackson -----
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Logging -----
logging.level.com.servicedesk=INFO
